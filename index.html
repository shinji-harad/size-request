<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japan Casings Size Request</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Noto+Sans+Georgian:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Monochrome, single light theme. Hairline rules, square corners, small spaced uppercase labels, generous white space. */
:root{
  --bg:#fafaf9; --surface:#ffffff; --ink:#111318; --muted:#6e7176;
  --line:#e2e2df; --strong:#111318; --fill:#f1f1ef;
  --body:"Manrope","Noto Sans Georgian","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--body);padding-bottom:56px;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:0 20px}
header.top{padding:40px 0 8px}
.logo{display:block;width:200px;max-width:60%;height:auto}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lang{display:flex;border:1px solid var(--line)}
.lang button{font:600 11px/1 var(--body);letter-spacing:.1em;padding:9px 12px;border:0;background:var(--surface);color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--strong);color:#fff}
.fields .full{grid-column:1/-1}
.eyebrow{font:600 11px/1 var(--body);letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:44px 0 14px}
h1{font:300 30px/1.25 var(--body);letter-spacing:-.01em;margin:0 0 16px;text-wrap:balance}
.lead{margin:0 0 18px;color:var(--muted);font-size:14px;max-width:60ch}
.lead b{color:var(--ink);font-weight:600}
.notice{margin:0 0 22px;padding:14px 0;border-top:1px solid var(--strong);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.notice b{display:block;color:var(--ink);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:11px;margin-bottom:4px}
.cond{display:grid;grid-template-columns:repeat(2,1fr);gap:0;margin:0 0 28px;padding:0;list-style:none;border-top:1px solid var(--line)}
.cond li{font-size:13px;padding:10px 0;border-bottom:1px solid var(--line)}
.cond li:nth-child(odd){padding-right:12px}
.cond li span{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.fields label,.notes label{display:flex;flex-direction:column;gap:6px;font:600 10px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:0;padding:10px 12px;-webkit-appearance:none;appearance:none}
input::placeholder,textarea::placeholder{color:#b3b5b8}
input:focus,textarea:focus{outline:none;border-color:var(--strong)}
button:focus-visible,a:focus-visible{outline:1px solid var(--strong);outline-offset:3px}
.bar{position:sticky;top:0;z-index:5;background:rgba(250,250,249,.96);backdrop-filter:blur(6px);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 4px 4px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:500 13px/1 var(--body);letter-spacing:.04em;padding:9px 13px;border-radius:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;position:relative;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--strong);color:#fff;border-color:var(--strong)}
.chip .dot{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;border-radius:8px;background:var(--surface);color:var(--ink);border:1px solid var(--strong);font:600 9px/14px var(--body);text-align:center;padding:0 4px}
.tools{display:flex;gap:8px;margin-top:8px}
.tools input{flex:1;min-width:0;font-size:15px}
button.ghost{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;padding:0 14px;min-height:42px;border-radius:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.ghost[aria-pressed="true"]{border-color:var(--strong);background:var(--strong);color:#fff}
.count{font-size:11px;letter-spacing:.06em;color:var(--muted);margin-top:8px}
.count b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.group h2{display:flex;align-items:baseline;gap:10px;font:300 26px/1 var(--body);margin:34px 0 10px;letter-spacing:-.01em}
.group h2 small{font:600 10px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.list{border-top:1px solid var(--strong)}
.row{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.row.has .size{font-weight:700}
.row.has input{border-color:var(--strong)}
.size{flex:1;min-width:0;font:500 15px/1.3 var(--body);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.tag{font:600 9px/1 var(--body);letter-spacing:.14em;padding:3px 5px;border:1px solid var(--line);color:var(--muted);margin-left:8px;vertical-align:2px}
.row input{width:92px;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;padding:8px 10px}
.unit{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);width:26px}
.addrow input.sz{flex:1;min-width:0;width:auto;text-align:left;font-weight:500}
.del{border:0;background:none;color:var(--muted);font:300 20px/1 var(--body);cursor:pointer;padding:4px;width:24px}
.addbtn{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:600 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;padding:16px 0;cursor:pointer}
.empty{padding:32px 0;text-align:center;color:var(--muted);font-size:13px}
.contact{margin-top:48px}
.sec{font:300 26px/1.2 var(--body);margin:0 0 14px;letter-spacing:-.01em}
.notes{margin:20px auto 0}
.notes textarea{width:100%;min-height:90px;resize:vertical;margin-top:6px}
.finish{margin-top:48px;padding-top:28px;border-top:1px solid var(--strong)}
.finish h2{font:300 26px/1.2 var(--body);margin:0 0 8px;letter-spacing:-.01em}
.preview{background:var(--surface);border:1px solid var(--line);padding:16px;font:500 13px/1.7 var(--body);font-variant-numeric:tabular-nums;white-space:pre-wrap;max-height:320px;overflow:auto;margin:0 0 16px}
.sendrow{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
a.wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--strong);color:#fff;text-decoration:none;font:600 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;padding:0 26px;min-height:50px;border-radius:0;flex:1}
a.wa[aria-disabled="true"]{opacity:.3;pointer-events:none}
.sendrow button.ghost{min-height:50px}
.status{font-size:12px;color:var(--muted);min-height:1em;margin-top:8px}
.clearrow{margin-top:18px;font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-decoration:underline;cursor:pointer}
.foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);font-size:11px;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot a{color:inherit}
.kb{position:fixed;left:0;right:0;top:0;z-index:20;display:none;justify-content:flex-end;gap:8px;padding:6px 12px;background:var(--surface);border-top:1px solid var(--line)}
.kb.on{display:flex}
.kb button{font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;padding:10px 16px;border-radius:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.kb button.done{background:var(--strong);color:#fff;border-color:var(--strong)}
@media (max-width:440px){.fields{grid-template-columns:1fr}.row input{width:84px}h1{font-size:26px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

  const qi=document.createElement("input");qi.id="xq"+r+"_"+i;qi.inputMode="numeric";qi.placeholder="–";qi.value=x.q||"";qi.setAttribute("aria-label","Maximum quantity");
  const u=document.createElement("span");u.className="unit";u.textContent=T("pcs");
  const del=document.createElement("button");del.type="button";del.className="del";del.textContent="×";del.setAttribute("aria-label","Remove this size");
  sz.addEventListener("input",()=>{x.s=sz.value;row.classList.toggle("has",x.q>0&&x.s.trim()!=="");update()});
  qi.addEventListener("input",()=>{const v=parseInt(qi.value.replace(/\D/g,""),10);qi.value=isNaN(v)?"":String(v);x.q=isNaN(v)?0:v;row.classList.toggle("has",x.q>0&&x.s.trim()!=="");update()});
  del.onclick=()=>{extra[r].splice(i,1);drawList();update()};
  row.append(sz,qi,u,del);return row;
}
function message(){
  const lines=[];let total=0;
  rims.forEach(r=>{
    SIZES.filter(s=>s.r===r&&qty[s.id]>0).forEach(s=>{lines.push(s.s+(s.t?" "+s.t:"")+" : "+qty[s.id]+" pcs");total+=qty[s.id]});
    (extra[r]||[]).filter(x=>x.s.trim()&&x.q>0).forEach(x=>{lines.push(x.s.trim()+" : "+x.q+" pcs (added)");total+=x.q});
  });
  let m="Maximum quantity per size (for reference, not an order)\n";
  if(co.value.trim())m+="Company: "+co.value.trim()+"\n";
  if(nm.value.trim())m+="Name: "+nm.value.trim()+"\n";
  if(ph.value.trim())m+="Phone: "+ph.value.trim()+"\n";
  if(em.value.trim())m+="Email: "+em.value.trim()+"\n";
  if(yr.value.trim())m+="Tire year: "+yr.value.trim()+" or newer\n";
  m+="\n"+lines.join("\n")+"\n\nTotal: "+lines.length+(lines.length===1?" size / ":" sizes / ")+total+" pcs";
  if(note.value.trim())m+="\n\nComments:\n"+note.value.trim();
  return {m,n:lines.length,total};
}
function update(){
  const r=message();
  document.getElementById("nSizes").textContent=r.n;
  document.getElementById("nPcs").textContent=r.total.toLocaleString("en-US");
  const wa=document.getElementById("wa");
  const ok=r.n>0||note.value.trim()!=="";
  wa.setAttribute("aria-disabled",ok?"false":"true");
  wa.href="https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(r.m);
  document.getElementById("preview").textContent=ok?r.m:T("nothing");
  drawChips();save();
}
["co","nm","ph","em","yr","note"].forEach(k=>document.getElementById(k).addEventListener("input",update));
yr.addEventListener("input",()=>{yr.value=yr.value.replace(/\D/g,"").slice(0,4);update()});
document.getElementById("q").addEventListener("input",drawList);
const only=document.getElementById("only");
only.onclick=()=>{onlyEntered=!onlyEntered;only.setAttribute("aria-pressed",String(onlyEntered));drawList()};
document.getElementById("copy").onclick=async()=>{
  const st=document.getElementById("status");
  try{await navigator.clipboard.writeText(message().m);st.textContent=T("copied");}
  catch(e){st.textContent=T("copyNo");}
};
applyLang();drawChips();drawList();update();
document.getElementById("clear").onclick=()=>{document.getElementById("clearAsk").hidden=false};
document.getElementById("clearNo").onclick=()=>{document.getElementById("clearAsk").hidden=true};
document.getElementById("clearYes").onclick=()=>{qty={};extra={};["co","nm","ph","em","yr","note"].forEach(k=>document.getElementById(k).value="");document.getElementById("clearAsk").hidden=true;drawList();update();window.scrollTo(0,0)};

// Done / Next bar above the phone keyboard (numeric keypads have no close key)
(function(){
  const kb=document.getElementById("kb"),vv=window.visualViewport;let hideT;
  function place(){const h=kb.offsetHeight||48;const top=vv?vv.offsetTop+vv.height-h:window.innerHeight-h;kb.style.top=top+"px";}
  function isField(el){return el&&el.tagName==="INPUT"&&(el.closest("#main")||el.closest(".fields"));}
  document.addEventListener("focusin",e=>{if(isField(e.target)){clearTimeout(hideT);kb.classList.add("on");place();}});
  document.addEventListener("focusout",()=>{hideT=setTimeout(()=>{if(!isField(document.activeElement))kb.classList.remove("on")},120);});
  if(vv){vv.addEventListener("resize",place);vv.addEventListener("scroll",place);}
  window.addEventListener("scroll",place,{passive:true});
  ["kbNext","kbDone"].forEach(id=>document.getElementById(id).addEventListener("mousedown",e=>e.preventDefault()));
  document.getElementById("kbDone").addEventListener("click",()=>{const a=document.activeElement;if(a&&a.blur)a.blur();kb.classList.remove("on");});
  document.getElementById("kbNext").addEventListener("click",()=>{
    const all=[...document.querySelectorAll(".fields input, #main input")];const i=all.indexOf(document.activeElement);
    const n=all[i+1];if(n){n.focus();n.scrollIntoView({block:"center"});}else{document.activeElement.blur();kb.classList.remove("on");}
  });
})();
</script>
